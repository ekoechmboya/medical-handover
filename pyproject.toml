[project]
name = "medical-handover-agent"
version = "0.1.0"
description = "Benchmark and evaluation toolkit for medical shift-handover quality (synthetic data, engineering evaluation only)."
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]
llm = ["google-generativeai>=0.7.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"